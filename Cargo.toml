[package]
name = "pith-unicode"
version = "0.1.0"
edition = "2024"
description = "Unicode NFC normalisation driven by tables generated from the UCD."
readme = "README.md"
license = "MIT"
categories = ["algorithms", "cryptography"]

[lib]
# The cdylib is the binary every language SDK binds through (ctypes,
# koffi, cgo); the rlib keeps the Rust consumers unchanged.
crate-type = ["cdylib", "rlib"]

# Only the tests exercise the suite's SHA-256 (hash equality on NFC forms);
# the library itself builds with an empty dependency table.
[dev-dependencies]
pith-digest = { git = "https://github.com/pith-hash/pith-digest.git", branch = "main" }

[[bin]]
name = "gen-reference"
path = "tools/gen-reference/main.rs"

# `unsafe_code` is denied at the crate root (`#![deny(unsafe_code)]` in
# src/lib.rs), with the single `#![allow(unsafe_code)]` confined to
# src/ffi.rs, the C ABI surface. It cannot live here: `[lints]` entries
# become command-line flags, and command-line lints cannot be
# re-allowed by inner attributes.
[lints.rust]
missing_docs = "deny"
